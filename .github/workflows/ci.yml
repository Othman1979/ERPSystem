name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # A stuck run fails here instead of holding the runner for the 6-hour default.
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: erp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/erp_test
      # CI-only values: the API refuses to start without them (src/common/config/env.validation.ts).
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The e2e suites spawn the built API (apps/api/dist/main.js).
      - run: pnpm --filter api build
      - run: pnpm --filter api exec prisma migrate deploy
      # Plans, currencies, countries and system roles; sign-up needs the TRIAL plan and OWNER role.
      - run: pnpm --filter api seed
        timeout-minutes: 2
      - name: test (api)
        # --forceExit: a suite that leaves a handle open must not keep the job alive.
        run: pnpm --filter api test --forceExit
        timeout-minutes: 20
      - name: test (other packages)
        run: pnpm -r --filter '!api' run test
