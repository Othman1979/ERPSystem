name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (MariaDB ${{ matrix.mariadb }})
    runs-on: ubuntu-latest
    # A stuck run fails here instead of holding the runner for the 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The supported range (ADR-019, docs/runbooks/deploy.md): the oldest
        # supported LTS and the newest LTS, which has innodb_snapshot_isolation
        # ON by default (SESSION_INIT_SQL). Pinned to LTS series, never a bare
        # major tag that moves by itself.
        mariadb: ['10.11', '11.8']
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: erp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/erp_test
      # CI-only values: the API refuses to start without them (src/common/config/env.validation.ts).
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
      # Backup tests (ADR-010 §10.2) run the MariaDB client tools installed below.
      MYSQLDUMP_PATH: mariadb-dump
      MYSQL_PATH: mariadb
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Database-independent checks run once, on the newest LTS leg.
      - run: pnpm lint
        if: matrix.mariadb == '11.8'
      - run: pnpm typecheck
        if: matrix.mariadb == '11.8'
      # The e2e suites spawn the built API (apps/api/dist/main.js).
      - run: pnpm --filter api build
      # The committed api-client must be what the API's document generates (PLAT-15, ADR-023):
      # write the document from the built app (no server), regenerate, and fail on any diff.
      - name: api-client matches the OpenAPI document
        if: matrix.mariadb == '11.8'
        run: |
          pnpm --filter api openapi:document "${{ runner.temp }}/openapi.json"
          OPENAPI_INPUT="${{ runner.temp }}/openapi.json" pnpm api-client:generate
          git diff --exit-code -- packages/api-client || {
            echo "packages/api-client is stale: run pnpm --filter api build, then"
            echo "  pnpm --filter api openapi:document openapi.json && OPENAPI_INPUT=openapi.json pnpm api-client:generate"
            exit 1
          }
      - run: pnpm --filter api exec prisma migrate deploy
      # Plans, currencies, countries and system roles; sign-up needs the TRIAL plan and OWNER role.
      - run: pnpm --filter api seed
        timeout-minutes: 2
      - name: test (api)
        # --forceExit: a suite that leaves a handle open must not keep the job alive.
        # Every API an e2e suite spawns checks its 2xx answers against the OpenAPI
        # document and appends mismatches here (PLAT-15, ADR-023).
        env:
          OPENAPI_RESPONSE_AUDIT: ${{ runner.temp }}/openapi-audit.jsonl
        run: pnpm --filter api test --forceExit
        timeout-minutes: 20
      - name: OpenAPI response audit (PLAT-15)
        if: ${{ !cancelled() }}
        run: |
          file="${{ runner.temp }}/openapi-audit.jsonl"
          if [ -s "$file" ]; then
            echo "Answers that do not match their declared OpenAPI schema:"
            sort -u "$file"
            exit 1
          fi
          echo "No mismatch."
      - name: test (other packages)
        if: matrix.mariadb == '11.8'
        run: pnpm -r --filter '!api' run test
